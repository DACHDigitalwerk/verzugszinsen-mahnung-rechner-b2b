[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "b2b-verzugszinsen"
version = "1.0.0"
description = "Taggenaue kaufmännische Verzugszinsberechnung & Mahnwesen im DACH-Raum (§ 288 BGB, § 456 UGB, Art. 104 OR)"
authors = [
    { name = "DACH Digitalwerk", email = "dach.digitalwerk@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
keywords = [
    "verzugszinsen",
    "mahnung",
    "b2b",
    "bundesbank-basiszinssatz",
    "schadenspauschale",
    "bgb-288",
    "ugb-456",
    "schkg",
    "dach-raum"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting"
]

[project.urls]
"Homepage" = "https://github.com/DACHDigitalwerk/verzugszinsen-mahnung-rechner-b2b"
"Live Rechner" = "https://dach-digitalwerk.netlify.app/mahnung-verzugszinsen-rechner/"
"Ratgeber & Leitfaden" = "https://dach-digitalwerk.netlify.app/verzugszinsen-berechnen-rechner-b2b.html"

[project.scripts]
b2b-zinsen = "b2b_verzugszinsen.cli:main"
