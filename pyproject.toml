[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verzugszinsen-b2b"
version = "1.0.0"
authors = [
  { name="DACH Digitalwerk", email="dach.digitalwerk@gmail.com" },
]
description = "DACH B2B Verzugszinsen- & Mahnspesen-Rechner 2026 nach § 288 BGB, Art. 104 OR & § 456 UGB inkl. 40-€-Pauschale"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Legal",
]
keywords = ["verzugszinsen", "mahnung", "mahnspesen", "bgb-288", "schweizer-recht", "ugb-456", "basiszinssatz", "bundesbank", "b2b"]

[project.urls]
"Homepage" = "https://dach-digitalwerk.netlify.app/mahnung-verzugszinsen-rechner/"
"Bug Tracker" = "https://github.com/DACHDigitalwerk/verzugszinsen-mahnung-rechner-b2b/issues"

[project.scripts]
dach-verzugszinsen = "verzugszinsen_b2b.cli:main"
